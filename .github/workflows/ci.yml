name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Force JavaScript-based actions onto Node.js 24 ahead of the
# 2026-06-02 default flip; silences the Node 20 deprecation banner.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned exact (not v2.5). Keep in sync with Makefile
          # GOLANGCI_LINT_VERSION.
          version: v2.5.0

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  test-integration:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: Verify Docker available
        run: |
          docker version
          docker compose version
      - name: Run integration tests
        run: make test-integration

  # Apple-container backend lives in runtime/applecontainer and is
  # darwin/arm64-only (see build tags). This job builds the Swift
  # bridge and runs the Go test suite on macOS so we get coverage of
  # cgo compilation, go:embed of libACBridge.dylib, and the
  # daemon-free unit tests. Daemon-dependent tests skip cleanly when
  # Apple's `container` apiserver isn't running (which it won't be on
  # a GitHub-hosted runner without setup).
  test-darwin:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: Build Swift bridge
        run: make bridge
      - run: go vet ./...
      - run: go test -race -count=1 ./...
